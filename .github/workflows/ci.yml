name: CI - Tests Backend (Innovatech Chile)

# Corre con push a la rama feature/prueba-ci (donde se prueba el CI
# antes de hacer el Pull Request a develop). Es un workflow totalmente
# independiente del cd.yml: si este falla, NO afecta al despliegue, y viceversa.
on:
  push:
    branches:
      - "feature/prueba-ci"

jobs:
  test-ventas:
    name: Tests Backend Ventas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back-Ventas_SpringBoot/Springboot-API-REST

    steps:
      - name: Checkout (git clone...)
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Ejecutar tests con Maven (perfil test / H2)
        run: mvn -B test -Dspring.profiles.active=test

      - name: Publicar resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ventas
          path: back-Ventas_SpringBoot/Springboot-API-REST/target/surefire-reports/
          retention-days: 5

  test-despachos:
    name: Tests Backend Despachos
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO

    steps:
      - name: Checkout (git clone...)
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Ejecutar tests con Maven (perfil test / H2)
        run: mvn -B test -Dspring.profiles.active=test

      - name: Publicar resultados de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-despachos
          path: back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO/target/surefire-reports/
          retention-days: 5